<body>

  <main class="showcase-container">

      <p data-en="Scroll or drag inside the stage to rotate categories and spin 3D WebGL Infinity Fit equipment." data-tanglish="Wheel-a thallu bossuh! 3D WebGL circular gallery-la Infinity Fit machines-a geth-ah paaru!">
        Scroll or drag inside the stage to rotate categories and spin 3D WebGL Infinity Fit equipment.

    <!-- Interactive Stage (Page scroll disabled when mouse inside stage) -->

      <!-- Right Column: CircularGallery -->

  <!-- Sound & Interactive Module -->
  <script type="module">
    import { Renderer, Camera, Transform, Plane, Mesh, Program, Texture } from 'ogl';

    // --- Web Audio API Mechanical Tick Sound ---
    let audioCtx = null;
    function playTickSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
      } catch (e) {}
    }

    // --- Prevent Site Scroll When Mouse Inside Interactive Stage ---
    const stage = document.getElementById('interactiveStage');
    if (stage) {
      stage.addEventListener('wheel', (e) => {
        e.preventDefault();
      }, { passive: false });
      
      stage.addEventListener('touchmove', (e) => {
        e.preventDefault();
      }, { passive: false });
    }

    let allEquipments = [];
    let activeCategory = 'All';
    let appInstance = null;

    const categories = ['All', 'Cardio', 'Pin Loaded', 'Plate Loaded', 'Racks & Benches', 'Free Weights', 'Functional'];

    // --- OptionWheel Implementation with React Bits Physics ---
    function initOptionWheel() {
      const root = document.getElementById('optionWheelRoot');
      if (!root) return;

      root.innerHTML = '';
      const wheelContainer = document.createElement('div');
      wheelContainer.className = 'option-wheel';

      categories.forEach((cat, idx) => {
        const item = document.createElement('div');
        item.className = `option-wheel__item ${idx === 0 ? 'option-wheel__item--selected' : ''}`;
        item.textContent = cat;
        item.style.top = `${25 + idx * 52}px`;
        item.addEventListener('click', () => {
          document.querySelectorAll('.option-wheel__item').forEach(el => el.classList.remove('option-wheel__item--selected'));
          item.classList.add('option-wheel__item--selected');
          activeCategory = cat;
          playTickSound();
          updateGallery();
        });
        wheelContainer.appendChild(item);
      });

      root.appendChild(wheelContainer);
    }

    // --- CircularGallery Implementation with Hover Description & Name ---
    class CircularGalleryApp {
      constructor(container, items) {
        this.container = container;
        this.items = items;
        this.scroll = { ease: 0.05, current: 0, target: 0, last: 0 };
        this.init();
      }

      init() {
        this.container.innerHTML = `
          <div class="hover-tooltip-overlay" id="hoverTooltip">
            <div class="tooltip-desc" id="tooltipDesc">Hover over equipment cards to view 1-liner details</div>
            <div class="tooltip-name" id="tooltipName">INFINITY FIT GEAR</div>
          </div>
        `;

        this.tooltip = document.getElementById('hoverTooltip');
        this.tooltipDesc = document.getElementById('tooltipDesc');
        this.tooltipName = document.getElementById('tooltipName');

        this.renderer = new Renderer({ alpha: true, antialias: true, dpr: Math.min(window.devicePixelRatio || 1, 2) });
        this.gl = this.renderer.gl;
        this.gl.clearColor(0, 0, 0, 0);
        this.container.appendChild(this.gl.canvas);

        this.camera = new Camera(this.gl, { fov: 45 });
        this.camera.position.z = 20;

        this.scene = new Transform();
        this.planeGeometry = new Plane(this.gl, { heightSegments: 50, widthSegments: 100 });

        this.screen = { width: this.container.clientWidth, height: this.container.clientHeight };
        this.renderer.setSize(this.screen.width, this.screen.height);

        const fov = (this.camera.fov * Math.PI) / 180;
        const height = 2 * Math.tan(fov / 2) * this.camera.position.z;
        const width = height * (this.screen.width / this.screen.height);
        this.viewport = { width, height };

        this.createMedias();
        this.addEvents();
        this.update();
      }

      createMedias() {
        const galleryItems = this.items.length ? this.items : [
          { image: 'equipments/eq_1.png', name: 'Treadmill', desc: 'Motorized high-performance cardio treadmill.' }
        ];

        this.medias = galleryItems.map((item, idx) => {
          const texture = new Texture(this.gl, { generateMipmaps: true });
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.src = item.image;
          img.onload = () => { texture.image = img; };

          const program = new Program(this.gl, {
            vertex: `
              attribute vec3 position;
              attribute vec2 uv;
              uniform mat4 modelViewMatrix;
              uniform mat4 projectionMatrix;
              varying vec2 vUv;
              void main() {
                vUv = uv;
                vec3 p = position;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
              }
            `,
            fragment: `
              precision highp float;
              uniform sampler2D tMap;
              varying vec2 vUv;
              void main() {
                vec4 color = texture2D(tMap, vUv);
                gl_FragColor = color;
              }
            `,
            uniforms: { tMap: { value: texture } },
            transparent: true
          });

          const plane = new Mesh(this.gl, { geometry: this.planeGeometry, program });
          plane.setParent(this.scene);

          const scale = this.screen.height / 1500;
          plane.scale.y = (this.viewport.height * (680 * scale)) / this.screen.height;
          plane.scale.x = (this.viewport.width * (580 * scale)) / this.screen.width;

          const width = plane.scale.x + 2;
          plane.position.x = width * idx;

          return { plane, width, index: idx, name: item.name, desc: item.desc };
        });
      }

      addEvents() {
        let isDown = false;
        let startX = 0;

        this.container.addEventListener('mousedown', (e) => {
          isDown = true;
          startX = e.clientX;
        });

        window.addEventListener('mousemove', (e) => {
          if (!isDown) return;
          const dist = (startX - e.clientX) * 0.05;
          this.scroll.target += dist;
          startX = e.clientX;
          playTickSound();
        });

        window.addEventListener('mouseup', () => { isDown = false; });

        this.container.addEventListener('wheel', (e) => {
          this.scroll.target += e.deltaY * 0.04;
          playTickSound();
        });

        // Hover Detection to show 1-liner description and name below
        this.container.addEventListener('mousemove', (e) => {
          if (!this.medias || !this.medias.length) return;
          // Find center-most item
          let minDistance = Infinity;
          let closestMedia = null;

          this.medias.forEach(m => {
            const dist = Math.abs(m.plane.position.x);
            if (dist < minDistance) {
              minDistance = dist;
              closestMedia = m;
            }
          });

          if (closestMedia && minDistance < 4.5) {
            this.tooltipDesc.textContent = closestMedia.desc;
            this.tooltipName.textContent = closestMedia.name.toUpperCase();
            this.tooltip.classList.add('visible');
          } else {
            this.tooltip.classList.remove('visible');
          }
        });
      }

      update() {
        this.scroll.current += (this.scroll.target - this.scroll.current) * this.scroll.ease;

        if (this.medias) {
          this.medias.forEach((m) => {
            m.plane.position.x = m.width * m.index - this.scroll.current;
            const x = m.plane.position.x;
            const bend = 3;
            const H = this.viewport.width / 2;
            const R = (H * H + bend * bend) / (2 * bend);
            const effX = Math.min(Math.abs(x), H);
            const arc = R - Math.sqrt(R * R - effX * effX);
            m.plane.position.y = -arc;
            m.plane.rotation.z = -Math.sign(x) * Math.asin(effX / R);
          });
        }

        this.renderer.render({ scene: this.scene, camera: this.camera });
        this.raf = requestAnimationFrame(this.update.bind(this));
      }

      destroy() {
        if (this.raf) cancelAnimationFrame(this.raf);
      }
    }

    function updateGallery() {
      if (appInstance) appInstance.destroy();

      const filtered = activeCategory === 'All' 
        ? allEquipments 
        : allEquipments.filter(eq => eq.category === activeCategory);

      const items = filtered.map(eq => ({
        image: eq.image,
        name: eq.name,
        desc: eq.description
      }));

      const container = document.getElementById('circularGalleryRoot');
      if (container) {
        appInstance = new CircularGalleryApp(container, items);
      }
    }

    fetch('equipments.json')
      .then(res => res.json())
      .then(data => {
        allEquipments = data;
        initOptionWheel();
        updateGallery();
      });
  </script>

  <!-- Tanglish Toggle Script -->
  <script>
    let isTanglish = false;
    function toggleTanglishMode() {
      isTanglish = !isTanglish;
      document.querySelectorAll('[data-en]').forEach(el => {
        el.textContent = isTanglish ? el.getAttribute('data-tanglish') : el.getAttribute('data-en');
      });
      const label = document.getElementById('tanglishLabel');
      if (label) label.textContent = isTanglish ? 'TANGLISH MODE' : 'SLAY TANGLISH';
    }
  </script>
